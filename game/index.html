<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanternkeep — a tower defence of the last lighthouse</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05070f;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    /* Fill the window while keeping the 960x600 aspect. */
    width: min(100vw, 160vh);
    height: min(100vh, 62.5vw);
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Lanternkeep: build lantern towers on the stone circles to stop the gloom reaching the lighthouse"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
